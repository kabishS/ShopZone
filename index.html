<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login to ShopZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
 
:root {
  --blue: #2874f0;
  --bg: #f1f3f6;
  --yellow: #ffe500;
  --text: #212121;
  --muted: #5f6368;
  --border: #e3e5e8;
}
 
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
 
/* ---------- Navbar ---------- */
.navbar {
  background: var(--blue);
  height: 72px;
  padding: 0 64px;
  display: flex;
  align-items: center;
  gap: 24px;
}
 
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex-shrink: 0;
}
.logo .icon { width: 26px; height: 26px; }
 
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: 100px;
  flex: 0 1 640px;
}
.search input {
  flex: 1;
  min-width: 0;
  height: 48px;
  padding: 0 16px;
  border: 1px solid #d5dbe6;
  border-radius: 6px;
  font: inherit;
  font-size: 18px;
  color: var(--text);
  background: #fff;
}
.search input::placeholder { color: #6b6f76; }
.search input:focus { outline: 2px solid #fff; outline-offset: 1px; }
 
.search-btn {
  width: 52px;
  height: 48px;
  border: none;
  border-radius: 6px;
  background: #f7f8fa;
  color: #111;
  cursor: pointer;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.search-btn svg { width: 22px; height: 22px; }
.search-btn:hover { background: #fff; }
 
.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 40px;
}
.cart { color: #fff; display: grid; place-items: center; }
.cart svg { width: 30px; height: 30px; }
 
.nav-login {
  background: #fff;
  color: #000;
  text-decoration: none;
  font-weight: 700;
  font-size: 17px;
  padding: 0 22px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 5px;
}
.nav-login:hover { background: #f1f3f6; }
 
/* ---------- Login section ---------- */
.login {
  max-width: 1600px;
  margin: 0 auto;
  padding: 100px 64px 40px;
}
 
.login h1 {
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 40px;
}
 
.subtitle {
  text-align: center;
  font-size: 20px;
  color: var(--muted);
  margin-bottom: 44px;
}
 
.login label {
  display: block;
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 14px;
}
 
.login input {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  font: inherit;
  font-size: 19px;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 28px;
}
.login input::placeholder { color: #6b6f76; }
.login input:focus {
  outline: 2px solid var(--blue);
  outline-offset: 0;
  border-color: var(--blue);
}
 
.btn-login {
  width: 100%;
  height: 54px;
  margin-top: -2px;
  background: var(--yellow);
  color: #111;
  font: inherit;
  font-size: 20px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: filter .15s;
}
.btn-login:hover { filter: brightness(.96); }
.btn-login:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
 
.signup {
  text-align: center;
  font-size: 19px;
  color: var(--muted);
  margin: 26px 0 30px;
}
.signup a { color: #1a73e8; text-decoration: underline; }
 
.login hr {
  border: none;
  border-top: 1px solid #d0d3d8;
  margin-bottom: 30px;
}
 
.btn-secure {
  width: 100%;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 20px;
  font-weight: 400;
  border: 1px solid #5a5a5a;
  border-radius: 6px;
  cursor: pointer;
}
.btn-secure svg { width: 22px; height: 22px; }
.btn-secure:hover { background: rgba(0, 0, 0, .04); }
.btn-secure:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
 
.token-note {
  text-align: center;
  font-size: 17px;
  color: var(--muted);
  margin-top: 14px;
}
 
/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .navbar { padding: 0 20px; gap: 12px; }
  .search { margin-left: 16px; }
  .logo span { display: none; }
  .nav-right { gap: 18px; }
  .login { padding: 60px 20px 40px; }
  .login h1 { font-size: 28px; }
  .subtitle { font-size: 17px; }
}
@media (max-width: 560px) {
  .search { display: none; }
}
 
</style>
</head>
<body>
 
  <header class="navbar">
    <a class="logo" href="login.html">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 7V6a4 4 0 0 1 8 0v1h2.2a1.5 1.5 0 0 1 1.5 1.4l.8 11.2A2.5 2.5 0 0 1 18 22.3H6a2.5 2.5 0 0 1-2.5-2.7l.8-11.2A1.5 1.5 0 0 1 5.8 7H8Zm2 0h4V6a2 2 0 0 0-4 0v1Zm-.5 3.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z" fill-rule="evenodd"/>
      </svg>
      <span>ShopZone</span>
    </a>
 
    <form class="search" role="search" onsubmit="return false;">
      <input type="text" placeholder="Search for products, brands and more" aria-label="Search">
      <button type="submit" class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>
        </svg>
      </button>
    </form>
 
    <div class="nav-right">
      <a class="cart" href="#" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M1.5 2.5h3.2a1 1 0 0 1 1 .8L6 5h15.3a1 1 0 0 1 1 1.3l-2.2 7.4a1.6 1.6 0 0 1-1.5 1.1H8.6l.4 1.7h10.7a1 1 0 1 1 0 2H8.2a1 1 0 0 1-1-.8L4 4.5H1.5a1 1 0 1 1 0-2Z"/>
          <circle cx="9.5" cy="21" r="1.7"/><circle cx="17.5" cy="21" r="1.7"/>
        </svg>
      </a>
      <a class="nav-login" href="login.html">Login</a>
    </div>
  </header>
 
  <main class="login">
    <h1>Login to ShopZone</h1>
    <p class="subtitle">Get access to your Orders, Wishlist and Recommendations</p>
 
    <form id="loginForm" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="Enter email" autocomplete="email">
 
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
 
      <button type="button" id="loginBtn" class="btn-login">Login</button>
    </form>
 
    <p class="signup">New to ShopZone? <a href="#">Create an account</a></p>
 
    <hr>
 
    <button type="button" id="autoLoginBtn" class="btn-secure">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2 4 5.2v6.2c0 5 3.4 9.3 8 10.6V2Z"/>
        <path d="M12 2l8 3.2v6.2c0 5-3.4 9.3-8 10.6V2Z" opacity=".0"/>
        <path d="M12 2l8 3.2v6.2c0 5-3.4 9.3-8 10.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      Secure Auto-Login
    </button>
    <p class="token-note">Uses Secure Environment Token</p>
  </main>
 
  <script>
// Open home.html when the Login button is clicked
document.getElementById("loginBtn").addEventListener("click", function () {
  window.location.href = "home.html";
});
 
// Pressing Enter inside the form does the same
document.getElementById("loginForm").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    window.location.href = "home.html";
  }
});
 
// Secure Auto-Login also goes to the home page
document.getElementById("autoLoginBtn").addEventListener("click", function () {
  window.location.href = "home.html";
});
 
</script>
</body>
</html>
