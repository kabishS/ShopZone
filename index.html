<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login to ShopZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header class="navbar">
    <a class="logo" href="index.html">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 7V6a4 4 0 0 1 8 0v1h2.2a1.5 1.5 0 0 1 1.5 1.4l.8 11.2A2.5 2.5 0 0 1 18 22.3H6a2.5 2.5 0 0 1-2.5-2.7l.8-11.2A1.5 1.5 0 0 1 5.8 7H8Zm2 0h4V6a2 2 0 0 0-4 0v1Zm-.5 3.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z" fill-rule="evenodd"/>
      </svg>
      <span>ShopZone</span>
    </a>

    <form class="search" role="search" onsubmit="return false;">
      <input type="text" placeholder="Search for products, brands and more" aria-label="Search">
      <button type="submit" class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>
        </svg>
      </button>
    </form>

    <div class="nav-right">
      <a class="cart" href="#" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M1.5 2.5h3.2a1 1 0 0 1 1 .8L6 5h15.3a1 1 0 0 1 1 1.3l-2.2 7.4a1.6 1.6 0 0 1-1.5 1.1H8.6l.4 1.7h10.7a1 1 0 1 1 0 2H8.2a1 1 0 0 1-1-.8L4 4.5H1.5a1 1 0 1 1 0-2Z"/>
          <circle cx="9.5" cy="21" r="1.7"/><circle cx="17.5" cy="21" r="1.7"/>
        </svg>
      </a>
      <a class="nav-login" href="index.html">Login</a>
    </div>
  </header>

  <main class="login">
    <h1>Login to ShopZone</h1>
    <p class="subtitle">Get access to your Orders, Wishlist and Recommendations</p>

    <form id="loginForm" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="Enter email" autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">

      <button type="button" id="loginBtn" class="btn-login">Login</button>
    </form>

    <p class="signup">New to ShopZone? <a href="#">Create an account</a></p>

    <hr>

    <button type="button" id="autoLoginBtn" class="btn-secure">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2 4 5.2v6.2c0 5 3.4 9.3 8 10.6V2Z"/>
        <path d="M12 2l8 3.2v6.2c0 5-3.4 9.3-8 10.6V2Z" opacity=".0"/>
        <path d="M12 2l8 3.2v6.2c0 5-3.4 9.3-8 10.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      Secure Auto-Login
    </button>
    <p class="token-note">Uses Secure Environment Token</p>
  </main>

  <script src="index.js"></script>
</body>
</html>
